function pins(){const p=all().filter(x=>x.n.pin);return `<h1 class="hello">Pinned</h1><p class="sub">Your starred notes, one tap away.</p>`+(p.map(x=>noteRow(x,1)).join('')||'<div class="empty"><big>☆</big>Nothing pinned yet. Open a note and tap the star.</div>')+remSec()}
function profile(){const u=S.user,w=all().reduce((a,x)=>a+words(x.n.body),0);
 return `<h1 class="hello">Profile</h1><div class="card" style="text-align:center"><div class="av">${u.avatar}</div><div class="chips" style="justify-content:center">${AV.map(a=>`<button class="chip ${a==u.avatar?'sel':''}" data-a="av" data-v="${a}">${a}</button>`).join('')}</div></div>
 <div class="card"><label for="pn"><b>Your name</b></label><input class="in" id="pn" value="${esc(u.name)}" placeholder="What should we call you?"><label for="pb" style="display:block;margin-top:12px"><b>About you</b></label><input class="in" id="pb" value="${esc(u.bio)}" placeholder="A line about you"></div>
 <div class="card stats"><div><b>${all().length}</b><span>notes</span></div><div><b>${S.cats.length}</b><span>categories</span></div><div><b>${w}</b><span>words</span></div></div>`}
function settings(){const s=S.set,sg=(k,o)=>`<div class="seg">${o.map(([v,l])=>`<button class="${s[k]==v?'on':''}" data-a="set" data-k="${k}" data-v="${v}">${l}</button>`).join('')}</div>`;
 return `<h1 class="hello">Settings</h1><div class="card"><b>Look and feel</b><p class="sub" style="margin:4px 0 0">Tap a style to try it right away.</p><div class="skins">${Object.keys(SK).map(k=>`<button class="sk ${!s.seasonal&&(SK[s.skin]?s.skin:'riso')==k?'on':''}" data-a="skin" data-v="${k}" style="background-color:${SK[k].v['--bg']};background-image:${SK[k].img};background-size:${SK[k].size};background-repeat:${SK[k].rep||'repeat'};color:${SK[k].v['--ink']}"><span>${SK[k].n}</span><i>${SK[k].pal.slice(0,4).map(c=>`<u style="background:${c}"></u>`).join('')}</i></button>`).join('')}</div>${[['hand','Handwritten titles'],['tod','Time-of-day colours'],['seasonal','Seasonal styles']].map(([k,l])=>`<button class="tg ${s[k]?'on':''}" data-a="tog" data-k="${k}"><span>${l}</span><b>${s[k]?'On':'Off'}</b></button>`).join('')}${s.seasonal?`<p class="sub" style="margin:8px 0 0">Today’s style: ${SK[skinNow()].n}</p>`:''}</div>
 <div class="card"><b>Light or dark</b><p class="sub" style="margin:4px 0 8px">Applies to the Inkdrop style. The other styles set their own colours.</p>${sg('theme',[['auto','Auto'],['light','Light'],['dark','Dark']])}</div>
 <div class="card"><b>Text size</b><div style="height:8px"></div>${sg('size',[['s','Small'],['m','Medium'],['l','Large']])}</div>
 <div class="card"><b>Fading notes</b><p class="sub" style="margin:4px 0 10px">Notes you don’t open slowly lose colour, then move to the compost shelf. Pinned notes never fade.</p>${sg('fade',[[14,'14 days'],[30,'30 days'],[60,'60 days'],[0,'Never']])}</div>
 <div class="card"><b>PIN lock</b><p class="sub" style="margin:4px 0 10px">${s.pin?'PIN is on: the app asks for it when opened, and locked notes need it.':'Set a 4-digit PIN to lock the app and single notes.'} It hides notes but does not encrypt them.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn g" data-a="setpin">${s.pin?'Change PIN':'Set PIN'}</button>${s.pin?'<button class="btn g" data-a="rmpin">Remove PIN</button>':''}</div></div>
 <div class="card"><b>Receive a note</b><p class="sub" style="margin:4px 0 10px">Open a note and tap Share to show its QR code. Scan one here to receive it. Notes go straight between phones, with no server in the middle.</p><div style="display:flex;gap:8px"><button class="btn g" data-a="scan">Scan QR</button><button class="btn g" data-a="paste">Paste code</button></div></div>
 <div class="card"><b>Backup &amp; restore</b><p class="sub" style="margin:4px 0 10px">Notes live only on this phone’s browser. Copy a backup to keep it safe or move to a new phone.</p><div style="display:flex;gap:8px"><button class="btn g" data-a="export">Copy backup</button><button class="btn g" data-a="import">Restore</button></div></div>
 <div class="card"><b>Erase everything</b><p class="sub" style="margin:4px 0 10px">Deletes all notes from this device.</p><button class="btn d" data-a="wipe">Erase all notes</button></div>`}
function render(){theme();const v=V.v,app=document.getElementById('app');
 app.innerHTML={home,cat:catView,edit,pins,profile,settings,compost:compostV}[v]();
 const tab=v=='cat'||v=='edit'||v=='compost'?'home':v;

 if(v=='cat')app.insertAdjacentHTML('beforeend',`<button class="fab" data-a="newnote2" aria-label="New note">＋</button>`);icons(app)}
function dlg(h,ok,label='Save'){const m=document.getElementById('mod');m.innerHTML=`<div>${h}<div class="acts"><button class="btn g" data-a="x">Cancel</button><button class="btn" id="ok">${label}</button></div></div>`;m.className='o';m.dataset.sel='';

const close=()=>{stopCam();const m=document.getElementById('mod');m.className='';delete m.dataset.th;delete m.dataset.lock;m.style.background='';m.style.alignItems=''};

  const em=c?c.emoji:'',co=+m.querySelector('#cc .sel').dataset.v;if(c){Object.assign(c,{name:n,emoji:em,color:co})}else S.cats.push({id:uid(),name:n,emoji:em,color:co,subs:[]});save();render()})}
function nameDlg(t,val,cb,del){dlg(`<h2>${t}</h2><label for="dn">Name</label><input class="in" id="dn" value="${esc(val)}">${del?'<button class="btn d" data-a="'+del+'" style="margin-top:14px">Delete</button>':''}`,m=>{const n=m.querySelector('#dn').value.trim();if(!n){toast('Please enter a name');return false}cb(n);save();render()})}
function addNote(sid){const c=cat(V.cat),s=c.subs.find(s=>s.id==sid),n={id:uid(),title:'',body:'',pin:false,t:Date.now(),tags:[],col:-1};s.notes.unshift(n);save();V.note=n.id;V.v='edit';render()}

document.addEventListener('click',e=>{const b=e.target.closest('.vd')||e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,d=b.dataset,c=cat(V.cat);
 switch(a){
 case'tab':V.v=d.v;V.q='';render();break;case'home':V.v='home';render();break;

 case'setpin':S.set.pin?askPin(newPin):newPin();break;

 case'cat':V.cat=d.id;V.fl={};V.v='cat';render();break;

 case'compost':V.v='compost';render();break;
 case'scan':scan();break;
 case'share2':{const x=find(V.note),n=x.n,code=enc({t:n.title,b:n.body,g:n.tags,c:n.col});shareDlg(n.title||'Untitled note',code,(n.title?n.title+'\n\n':'')+n.body);break}
 case'sharecat':{const cc=cat(d.id||V.cat);let skip=0;const subs=cc.subs.map(s=>({n:s.name,l:s.notes.filter(n=>{const hide=sealed(n)||(n.lock&&S.set.pin);if(hide)skip++;return !hide}).map(n=>({t:n.title,b:n.body,g:n.tags,c:n.col}))}));const rd=cc.name+'\n'+subs.map(s=>'\n■ '+s.n+'\n'+s.l.map(n=>'• '+(n.t||'Untitled')+(n.b?'\n'+n.b:'')).join('\n\n')).join('\n');shareDlg(cc.name,enc({k:cc.name,s:subs},'INK2:'),rd,skip?skip+' sealed or locked note'+(skip>1?'s are':' is')+' left out.':'');break}
 case'nshare':try{navigator.share({title:V.shN,text:V.sh}).catch(()=>{})}catch(e){toast('Sharing isn’t available here. Use Copy text.')}break;
 case'ctext':{const t=document.getElementById('bx');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('Copied'),()=>toast('Press and hold the text to copy'))}catch(e){toast('Press and hold the text to copy')}break}
 case'paste':dlg('<h2>Paste a note code</h2><p class="sub">Paste the code your friend sent you.</p><textarea class="in" id="bx" rows="5" placeholder="INK1:…"></textarea>',m=>recv(m.querySelector('#bx').value.trim()),'Receive');break;
 case'seal':{const x=find(V.note),mn=new Date(Date.now()+6e4-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);dlg(`<h2>Seal this note</h2><p class="sub">Choose when it can be opened. Until then nobody, including you, can read or edit it.</p><label for="sd">Open on</label><input class="in" type="datetime-local" id="sd" min="${mn}">`,m=>{const v=m.querySelector('#sd').value;if(!v||new Date(v)<=new Date()){toast('Pick a future date and time');return false}x.n.seal=v;x.n.sealedOn=Date.now();delete x.n.opened;save();V.v='cat';V.cat=x.c.id;render();toast('Sealed until '+fdt(v))},'Seal note');break}
 case'share':{const x=find(V.note),code=enc({t:x.n.title,b:x.n.body,g:x.n.tags,c:x.n.col});let q='';if(code.length<=1400&&window.qrcode){try{const r=qrcode(0,'L');r.addData(code);r.make();q='<div class="qr">'+r.createSvgTag({cellSize:4,margin:3,scalable:true})+'</div>'}catch(e){}}
  dlg(`<h2>Share “${esc(x.n.title||'Untitled note')}”</h2>${q?'<p class="sub">Ask your friend to open Inkdrop, then Settings › Receive a note › Scan QR.</p>'+q:'<p class="sub">This note is too long for a QR code, or QR isn’t available. Copy the code and send it in a chat.</p>'}<textarea class="in" id="bx" rows="3" readonly>${esc(code)}</textarea>`,()=>{const t=document.getElementById('bx');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('Code copied'),()=>toast('Press and hold to copy'))}catch(e){toast('Press and hold to copy')}return false},'Copy code');break}
 case'keep':{const x=find(d.id);x.n.seen=Date.now();save();render();toast('Kept. It’s fresh again');break}
 case'let':{const x=find(d.id);x.s.notes=x.s.notes.filter(n=>n!==x.n);save();render();toast('Let go');break}
 case'letall':sure('This deletes all '+stale().length+' notes on the compost shelf.',()=>{const ids=stale().map(x=>x.n.id);S.cats.forEach(c=>c.subs.forEach(s=>s.notes=s.notes.filter(n=>!ids.includes(n.id))));save();render()});break;case'open':{const x=find(d.id),go=()=>{x.n.seen=Date.now();save();V.note=d.id;V.v='edit';render()},go2=()=>{if(x.n.seal&&!x.n.opened){dlg(`<div style="text-align:center"><i class="wax big cr"></i></div><h2>A letter from your past self</h2><p class="sub">Written ${new Date(x.n.sealedOn||x.n.t).toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'})} and sealed until now.</p>`,()=>{x.n.opened=1;save();setTimeout(go,0)},'Open the letter')}else go()};V.prev=V.v;if(sealed(x.n)){toast('Sealed until '+fdt(x.n.seal));break}if(x.n.lock&&S.set.pin&&!V.un[d.id])askPin(()=>{V.un[d.id]=1;go2()});else go2();break}
 case'back':{const x=find(V.note);if(x&&!x.n.title&&!x.n.body){x.s.notes=x.s.notes.filter(n=>n.id!=x.n.id);save()}V.v=V.prev=='pins'?'pins':V.prev=='home'?'home':'cat';if(x&&V.v=='cat')V.cat=x.c.id;render();break}
 case'newcat':catDlg();break;case'editcat':catDlg(c);break;

 case'editsub':{const s=c.subs.find(s=>s.id==d.id);nameDlg('Edit sub-title',s.name,n=>s.name=n,'delsub'+d.id);break}

 case'pin':{const x=find(V.note);x.n.pin=!x.n.pin;save();render();break}
 case'ins':{const t=document.getElementById('nb'),p=t.selectionStart,v=t.value,ls=v.lastIndexOf('\n',p-1)+1,ins=d.t.endsWith(' ')&&d.t.length>3?d.t:d.t;t.value=v.slice(0,ls)+(d.t.length<=2?ins:'')+v.slice(ls,p)+(d.t.length>2?ins:'')+v.slice(p);t.focus();t.dispatchEvent(new Event('input'));break}
 case'delnote':sure('This note will be removed from your phone.',()=>{const x=find(V.note);x.s.notes=x.s.notes.filter(n=>n!==x.n);save();V.v='cat';V.cat=x.c.id;render()});break;
 case'av':S.user.avatar=d.v;save();render();break;
 case'set':S.set[d.k]=d.k=='fade'?+d.v:d.v;save();render();break;

 case'wipe':sure('All notes, categories and profile details will be erased.',()=>{S={user:{name:'',avatar:'🚀',bio:''},set:{theme:S.set.theme,size:S.set.size},cats:[]};save();V.v='home';render()});break;
 default:if(a.startsWith('delsub')){}}
 if(a=='editsub'){}
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a^="delsub"]');if(!b)return;const id=b.dataset.a.slice(6),c=cat(V.cat);close();sure('This deletes the sub-title and all its notes.',()=>{c.subs=c.subs.filter(s=>s.id!=id);save();render()})});
